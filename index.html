<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Peminjaman Barang</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Pembungkus utama: sidebar untuk navigasi dan panel utama untuk isi aplikasi. -->
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <p class="brand-label">Inventaris</p>
            <h2>Peminjaman</h2>
          </div>
        </div>

        <!-- Tombol data-tab terhubung ke panel yang memiliki data-panel yang sama. -->
        <nav class="nav-menu" aria-label="Menu utama">
          <button type="button" class="nav-item active" data-tab="barang" aria-selected="true">Barang</button>
          <button type="button" class="nav-item" data-tab="peminjaman" aria-selected="false">Peminjaman</button>
          <button type="button" class="nav-item" data-tab="laporan" aria-selected="false">Laporan</button>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Sistem Administrasi</p>
            <h1>Peminjaman Barang</h1>
          </div>
          <button class="primary-btn" type="button" id="quickAddBtn">+ Tambah Data</button>
        </header>

        <!-- Ringkasan angka diperbarui oleh JavaScript berdasarkan data tersimpan. -->
        <section class="stats-grid">
          <article class="stat-card purple">
            <span>Total Peminjaman</span>
            <strong id="totalBorrowCount">0</strong>
          </article>
          <article class="stat-card green">
            <span>Barang Dipinjam</span>
            <strong id="totalItemCount">0</strong>
          </article>
          <article class="stat-card yellow">
            <span>Sudah Kembali</span>
            <strong id="returnedCount">0</strong>
          </article>
        </section>

        <!-- Setiap panel cocok dengan tombol navigasi melalui nama data-tab. -->
        <section class="tab-panels">
          <!-- Daftar barang dan stok ditampilkan secara dinamis oleh app.js. -->
          <div class="tab-panel active" data-panel="barang">
            <div class="panel-header">
              <h3>Daftar Barang</h3>
              <span class="badge" id="inventoryStockCount">0</span>
            </div>
            <div id="inventoryList" class="inventory-list"></div>
          </div>

          <!-- Form untuk mencatat pinjaman dan tabel untuk melihat/menghapus transaksi. -->
          <div class="tab-panel" data-panel="peminjaman">
            <div class="content-grid">
              <div class="form-card">
                <h3>Form Peminjaman</h3>
                <form id="loanForm">
                  <div class="field-grid two-col">
                    <label>
                      <span>Nama Peminjam</span>
                      <input type="text" name="borrower" placeholder="Contoh: Andi" required />
                    </label>
                    <label>
                      <span>Barang</span>
                      <input type="text" name="item" placeholder="Contoh: Laptop" required />
                    </label>
                  </div>

                  <div class="field-grid two-col">
                    <label>
                      <span>Jumlah</span>
                      <input type="number" name="quantity" min="1" value="1" required />
                    </label>
                    <label>
                      <span>Status</span>
                      <select name="status">
                        <option value="Dipinjam">Dipinjam</option>
                        <option value="Dikembalikan">Dikembalikan</option>
                      </select>
                    </label>
                  </div>

                  <div class="field-grid two-col">
                    <label>
                      <span>Tanggal Pinjam</span>
                      <input type="date" name="borrowDate" required />
                    </label>
                    <label>
                      <span>Tanggal Kembali</span>
                      <input type="date" name="returnDate" required />
                    </label>
                  </div>

                  <button class="submit-btn" type="submit">Tambah Pinjaman</button>
                </form>
              </div>

              <div class="table-card">
                <div class="table-head">
                  <h3>Data Peminjaman</h3>
                  <span id="recordBadge" class="badge">0 data</span>
                </div>

                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Nama</th>
                        <th>Barang</th>
                        <th>Jumlah</th>
                        <th>Tanggal</th>
                        <th>Status</th>
                        <th>Aksi</th>
                      </tr>
                    </thead>
                    <tbody id="loanTableBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <!-- Laporan menampilkan ringkasan transaksi dalam bentuk tabel. -->
          <div class="tab-panel" data-panel="laporan">
            <div class="panel-header">
              <h3>Laporan Peminjaman</h3>
            </div>

            <div class="report-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Nama</th>
                    <th>Barang</th>
                    <th>Jumlah</th>
                    <th>Status</th>
                    <th>Tanggal</th>
                  </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="scripts/app.js"></script>
  </body>
</html>
